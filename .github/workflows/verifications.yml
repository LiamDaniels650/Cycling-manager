# Vérifications à chaque push et pull request : lint, types, empreinte de la simulation, tests fonctionnels.
# (La calibration, plus longue, se lance à la main : ./dev.sh calib.)
name: Vérifications
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Lint, types, empreinte
        run: ./dev.sh check
      - name: Tests fonctionnels
        run: node tests/features.js
      - name: Web Worker (aller-retour de l'état)
        run: node tests/worker_roundtrip.js
      - name: Ordres de final (bancs d'essai du sprint et de la côte)
        run: node tests/finals.js
      - name: Non-régression
        run: bash tests/regress.sh
      - name: Format (Prettier)
        run: npx prettier --check src/engine/*.js src/ui/*.js tests/*.js tools/*.js tools/*.mjs
      - name: Interface React assemblée
        run: node tools/build_react.mjs
      - name: Interface (affichage sans effet sur le hasard, parcours sans erreur)
        run: |
          pip install playwright
          python3 tests/ui_rng_react.py
          python3 tests/ui_replay.py
          python3 tests/ui_smoke_react.py
